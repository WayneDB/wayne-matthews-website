<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayne Matthews | Event Kit</title>

    <meta name="description" content="Event kit for Wayne Matthews — technical rider, stage plot, photos, and bio for booked shows.">
    <meta name="robots" content="noindex">

    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#380d11">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="theme-dark">
    <div data-component="templates"></div>
    <header>
        <div class="header-logo">
            <a href="index.html">
                <div data-component="logo-fullname"></div>
            </a>
        </div>
        <div class="row" style="width: auto; align-self: flex-end;">
                <button data-language="en" class="toggle">EN</button>
                <button data-language="nl" class="toggle">NL</button>
        </div>
    </header>

    <main>
        <section style="text-align: left;">
            <h1 data-string="eventkit">Event Kit</h1>

            <div class="space-lg"></div>

            <h3 data-string="technicalRider">Technical rider</h3>
            <p data-string="riderHint">You can download the full technical rider and stage plot here. Please share both with your sound engineer ahead of the show.</p>
            <button style="align-self: flex-start;" type="button" id="download-rider-btn">Download</button>
            
            <div class="space-lg"></div>
            
            <h3 data-string="biography">Biography</h3>
            <p data-string="shortBioHint">Short bio — for your event program or listing</p>
            <p data-render="bio-short" id="bio-short" style="max-width: 700px;"></p>
            <button style="align-self: flex-start;" type="button" id="copy-bio-btn" data-string="copy">Copy</button>
            
            <div class="space-lg"></div>

            <h3 data-string="photos">Photos</h3>
            <p class="muted" data-string="photosHint">Click a photo to download.</p>
            <div class="space-sm"></div>
            <div class="row gap-md" data-render="press-photos"></div>

            <h3 data-string="questions">Questions</h3>
            <div class="space-sm"></div>
            
                <a href="mailto:booking@wayne-matthews.com" class="link-btn">
                    <div class="link-btn-text">
                        <span class="link-btn-eyebrow" data-string="Contact">Contact</span>
                        <div class="row left gap-xs">
                            <svg class="icon" aria-hidden="true" viewBox="0 0 512 512"><path fill="currentColor" d="M48 64c-26.5 0-48 21.5-48 48 0 15.1 7.1 29.3 19.2 38.4l208 156c17.1 12.8 40.5 12.8 57.6 0l208-156c12.1-9.1 19.2-23.3 19.2-38.4 0-26.5-21.5-48-48-48L48 64zM0 196L0 384c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-188-198.4 148.8c-34.1 25.6-81.1 25.6-115.2 0L0 196z"/></svg>
                            <p class="link-btn-label">booking@wayne-matthews.com</p>
                        </div>
                    </div>
                </a>
        </section>
    </main>

    <div data-component="footer"></div>
    <div data-component="cookie-banner"></div>

    <script src="scripts/script.js"></script>
</body>
</html>
