<!-- Load Error Template -->
<template id="load-error-template">
    <div class="stack gap-xs pad-sm">
        <p class="eyebrow">Something went wrong</p>
        <p class="muted" data-field="message">Couldn't load this content — try refreshing the page.</p>
    </div>
</template>

<!-- Release Card Template -->
<template id="release-card-template">
    <a class="card stack" href="#" target="_blank" data-field="link">
        <img class="cover-img" src="" alt="" data-field="cover">
        <div class="stack  pad-xs">
            <p class="eyebrow" data-field="type"></p>
            <p data-field="title"></p>
            <p class="muted" data-field="year"></p>
        </div>
    </a>
</template>

<!-- Featured Release Template -->
<template id="featured-release-template">
    <div class="row gap-md fit-content">
        <a class="card" href="#" target="_blank" data-field="link" tabindex="-1" aria-hidden="true">
            <img class="cover-img" src="" alt="" data-field="cover">
        </a>
        <div class="stack gap-sm">
            <p class="eyebrow" data-field="year"></p>
            <h3 data-field="title"></h3>
                <a href="#" target="_blank" data-field="link" aria-label="">
                    <button aria-hidden="true" tabindex="-1" style="margin:0;">Listen</button>
                </a>
        </div>
    </div>
</template>

<!-- Tour Date Template -->
<template id="tour-date-template">
    <a class="card stack gap-sm pad-sm" href="#" target="_blank" data-field="link">
        <div class="stack gap-xs">
            <p class="eyebrow" data-field="date"></p>
            <div class="row gap-xs">
                <h3 data-field="title"></h3>
                <p class="muted" data-field="location"></p>
            </div>
        </div>
    </a>
</template>

<!--Video Template-->
<template id="video-template">
    <div class="video-embed">
        <iframe
            data-field="embed"
            src=""
            title=""
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>
    </div>
</template>

<!--Gallery Card Template-->
<template id="gallery-photo-template">
    <img class="gallery-img card" src="" alt="" data-field="image" tabindex="0" role="button">
</template>

<!-- Press Photo Template -->
<template id="press-photo-template">
    <a href="#" download class="card" data-field="link">
        <img class="gallery-img" src="" alt="" data-field="image">
    </a>
</template>

<!-- Merch Card Template -->
<template id="merch-card-template">
    <a class="card stack" href="#" target="_blank" data-field="link">
        <img class="cover-img" src="" alt="" data-field="image">
        <div class="stack pad-xs">
            <div class="swatch-row" data-field="swatches"></div>
            <p data-field="title"></p>
            <p class="muted" data-field="price"></p>
        </div>
    </a>
</template>
