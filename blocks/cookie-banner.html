<div id="cookie-banner" class="cookie-banner hide">
    <p>This site uses cookies. <a href="privacy.html" aria-label="Learn more about our cookie policy">Learn more</a>.</p>
    <div class="row gap-md">
        <label class="row gap-xs" style="width:fit-content">
            <input type="checkbox" checked disabled> Essential
        </label>
        <label class="row gap-xs" style="width:fit-content">
            <input type="checkbox" id="consent-functional"> Functional
        </label>
        <label class="row gap-xs" style="width:fit-content">
            <input type="checkbox" id="consent-analytics"> Analytics
        </label>
    </div>
    <div class="row gap-sm" style="width: auto;">
        <button id="cookie-decline" class="btn-secondary">Decline all</button>
        <button id="cookie-save" class="btn-secondary">Save preferences</button>
        <button id="cookie-accept-all">Accept all</button>
    </div>
</div>
