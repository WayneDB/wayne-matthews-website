<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayne Matthews | Press Kit</title>

    <meta name="description" content="Press kit for Wayne Matthews — bio, photos, music, and contact for press and booking.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Wayne Matthews | Press Kit">
    <meta property="og:description" content="Bio, photos, music, and contact information for press and booking.">
    <meta property="og:image" content="https://wayne-matthews.com/images/link-preview.jpg">
    <meta property="og:url" content="https://wayne-matthews.com/press.html">
    <link rel="canonical" href="https://wayne-matthews.com/press.html">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Wayne Matthews | Press Kit">
    <meta name="twitter:description" content="Bio, photos, music, and contact information for press and booking.">
    <meta name="twitter:image" content="https://wayne-matthews.com/images/link-preview.jpg">

    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#380d11">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="theme-dark">
    <div data-component="templates"></div>
    <header>
        <div class="header-logo">
            <a href="index.html">
                <div data-component="logo-fullname"></div>
            </a>
        </div>
        <div class="row" style="width: auto; align-self: flex-end;">
                <button data-language="en" class="toggle">EN</button>
                <button data-language="nl" class="toggle">NL</button>
        </div>
    </header>
    <main>
        <section style="text-align: left;">
            

            <h1 data-string="presskit">Press Kit</h1>
            <p class="eyebrow" data-string="singerSongwriter" style="margin-top: var(--space-xs);">Singer • Songwriter</p>

            <div class="space-md"></div>

            <div class="row gap-lg" style="align-items: flex-start;">
                <div style="flex: 1 1 320px;">
                    <div data-render="bio-full"></div>
                    <div class="space-md"></div>
                    <h3 data-string="recognition">Recognition</h3>
                    <div data-render="bio-mentions"></div>
                </div>

                <div style="flex: 1 1 280px;">
                    <div class="spotify-embed spotify-embed-lg">
                        <iframe
                            src="https://open.spotify.com/embed/artist/52mXoUUWT9j6qUcwM4ZwnO?utm_source=generator&theme=0"
                            title="Wayne Matthews on Spotify"
                            frameborder="0"
                            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                            loading="lazy">
                        </iframe>
                    </div>
                </div>
            </div>
        </section>

        <div class="divider"></div>
        <section style="text-align: left;">
            <h2 data-string="photos">Photos</h2>
            <p class="muted" data-string="photosHint">Click a photo to download.</p>
            <div class="space-sm"></div>
            <div class="row gap-md" data-render="press-photos"></div>
        </section>

        <div class="divider"></div>
        <section style="text-align: left;">
            <h2 data-string="upcomingShows">Upcoming Shows</h2>
            <div data-render="tour-dates">
                <div id="on-empty">
                    <p data-string="noShows">There are currently no shows planned.</p>
                </div>
            </div>
        </section>

        <div class="divider"></div>
        <section>
            <h2 data-string="contact">Contact</h2>
            <div class="row gap-sm">
                <a href="mailto:press@wayne-matthews.com" class="link-btn">
                    <div class="link-btn-text">
                        <span class="link-btn-eyebrow" data-string="press">Press &amp; media</span>
                        <div class="row left gap-xs">
                            <svg class="icon" aria-hidden="true" viewBox="0 0 512 512"><path fill="currentColor" d="M48 64c-26.5 0-48 21.5-48 48 0 15.1 7.1 29.3 19.2 38.4l208 156c17.1 12.8 40.5 12.8 57.6 0l208-156c12.1-9.1 19.2-23.3 19.2-38.4 0-26.5-21.5-48-48-48L48 64zM0 196L0 384c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-188-198.4 148.8c-34.1 25.6-81.1 25.6-115.2 0L0 196z"/></svg>
                            <p class="link-btn-label">press@wayne-matthews.com</p>
                        </div>
                    </div>
                </a>
                <a href="mailto:booking@wayne-matthews.com" class="link-btn">
                    <div class="link-btn-text">
                        <span class="link-btn-eyebrow" data-string="booking">Booking</span>
                        <div class="row left gap-xs">
                            <svg class="icon" aria-hidden="true" viewBox="0 0 512 512"><path fill="currentColor" d="M48 64c-26.5 0-48 21.5-48 48 0 15.1 7.1 29.3 19.2 38.4l208 156c17.1 12.8 40.5 12.8 57.6 0l208-156c12.1-9.1 19.2-23.3 19.2-38.4 0-26.5-21.5-48-48-48L48 64zM0 196L0 384c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-188-198.4 148.8c-34.1 25.6-81.1 25.6-115.2 0L0 196z"/></svg>
                            <p class="link-btn-label">booking@wayne-matthews.com</p>
                        </div>
                    </div>
                </a>
            </div>
        </section>
    </main>

    <div data-component="footer"></div>
    <div data-component="cookie-banner"></div>

    <script src="scripts/script.js"></script>
</body>
</html>
